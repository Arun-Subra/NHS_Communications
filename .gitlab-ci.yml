stages:
  - deploy

deploy_to_vm:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - apk add --update openssh rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$SERVER_IP "pkill -f 'docker-compose' || true; pkill -f 'docker build' || true; cd /opt/drp-touchpoint && docker-compose down --remove-orphans --timeout 10 || true"
    - rsync -avz --exclude='.git' --exclude='node_modules' --exclude='__pycache__' ./ $SSH_USER@$SERVER_IP:/opt/drp-touchpoint/
    - ssh $SSH_USER@$SERVER_IP "printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' '$SUPABASE_URL' '$SUPABASE_KEY' > /opt/drp-touchpoint/.env"
    - ssh $SSH_USER@$SERVER_IP "cd /opt/drp-touchpoint && docker-compose up -d --build"
    - sleep 10
    - ssh $SSH_USER@$SERVER_IP "curl -sf http://localhost:3000/api/me || (docker logs drp-touchpoint_backend_1 --tail 20 && exit 1)"