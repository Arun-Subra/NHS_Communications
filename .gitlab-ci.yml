stages:
  - deploy

deploy_to_vm:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  after_script:
    - apk add --update openssh 2>/dev/null || true
    - eval $(ssh-agent -s) 2>/dev/null || true
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add - 2>/dev/null || true
    - mkdir -p ~/.ssh && ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null || true
    - ssh -o ConnectTimeout=10 $SSH_USER@$SERVER_IP "pkill -f 'docker build' || true; pkill -f 'docker-compose' || true" || true

  before_script:
    - apk add --update openssh rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
    - echo "Host $SERVER_IP" >> ~/.ssh/config
    - echo "  ConnectTimeout 30" >> ~/.ssh/config
    - echo "  ServerAliveInterval 10" >> ~/.ssh/config
    - echo "  ServerAliveCountMax 3" >> ~/.ssh/config
  script:
    - ssh $SSH_USER@$SERVER_IP "pkill -f 'docker-compose' || true; pkill -f 'docker build' || true" || true
    - rsync -avz --exclude='.git' --exclude='node_modules' --exclude='__pycache__' ./ $SSH_USER@$SERVER_IP:/opt/drp-touchpoint/
    - ssh $SSH_USER@$SERVER_IP "printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\nGOOGLE_CLOUD_PROJECT=%s\nGOOGLE_CLOUD_LOCATION=%s\n' '$SUPABASE_URL' '$SUPABASE_KEY' '$GOOGLE_CLOUD_PROJECT' '$GOOGLE_CLOUD_LOCATION' > /opt/drp-touchpoint/.env"
    - ssh $SSH_USER@$SERVER_IP "echo '$GCP_CREDENTIALS_JSON' | base64 -d > /opt/drp-touchpoint/gcp-credentials.json"
    - ssh $SSH_USER@$SERVER_IP "echo 'GOOGLE_APPLICATION_CREDENTIALS=/opt/drp-touchpoint/gcp-credentials.json' >> /opt/drp-touchpoint/.env"
    - ssh $SSH_USER@$SERVER_IP "cd /opt/drp-touchpoint && docker-compose up -d --build"
    - sleep 8
    - ssh $SSH_USER@$SERVER_IP "curl -sf http://localhost:3000/api/health || (docker logs drp-touchpoint_backend_1 --tail 20 && exit 1)"