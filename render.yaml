services:
  - type: web
    name: drp-touchpoint
    env: python
    buildCommand: |
      npm install && npm run build && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false